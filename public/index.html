<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0055A4">
    <title>Montpellier Mobilité</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <svg width="0" height="0" class="svg-sprite" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-tram" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="9" y1="17" x2="7" y2="21"/><line x1="15" y1="17" x2="17" y2="21"/><circle cx="9" cy="13.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.5" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M8 17l4-8h4"/><path d="M12 9l-2.5-3H7"/><circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-parking" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9.5 17V7h3.2a3 3 0 010 6H9.5"/></symbol>
        <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 13l1.6-4.4A2 2 0 018.5 7h7a2 2 0 011.9 1.6L19 13v5h-2.5v-1.6h-9V18H5z"/><circle cx="8" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1.2" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4.5c3-2 6 1.5 9 0s5-1 5-1v9s-2-.5-5 1-6-2-9 0"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.7" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-11a7 7 0 1114 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 1.9"/></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      </defs>
    </svg>

    <div id="map"></div>

    <div id="top-ui">
        <div id="search-bar">
            <svg class="ic sb-lead" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="text" id="search-input" placeholder="Rechercher un arrêt" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Rechercher un arrêt">
            <span id="mode-title" hidden><span id="mode-title-text"></span><span id="mode-count"></span></span>
            <button id="search-clear" aria-label="Effacer" hidden><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
        <div id="line-filter">
            <button class="chip active" data-line="all">Toutes</button>
            <button class="chip" data-line="1" style="--chip:var(--line-1)">1</button>
            <button class="chip" data-line="2" style="--chip:var(--line-2)">2</button>
            <button class="chip" data-line="3" style="--chip:var(--line-3)">3</button>
            <button class="chip" data-line="4" style="--chip:var(--line-4)">4</button>
            <button class="chip" data-line="5" style="--chip:var(--line-5)">5</button>
        </div>
        <ul id="search-results" hidden></ul>
        <div id="loading-bar" hidden><span></span></div>
    </div>

    <div id="right-rail">
        <button id="locate-btn" class="fab fab-primary" aria-label="Me localiser">
            <svg class="ic" aria-hidden="true"><use href="#i-locate"/></svg>
        </button>
        <button id="menu-btn" class="fab" aria-label="Menu">
            <svg class="ic" aria-hidden="true"><use href="#i-more"/></svg>
        </button>
    </div>

    <nav id="bottom-nav">
        <button class="nav-btn active" data-mode="trams">
            <svg class="ic" aria-hidden="true"><use href="#i-tram"/></svg><span>Trams</span>
        </button>
        <button class="nav-btn" data-mode="velos">
            <svg class="ic" aria-hidden="true"><use href="#i-bike"/></svg><span>Vélos</span>
        </button>
        <button class="nav-btn" data-mode="parkings">
            <svg class="ic" aria-hidden="true"><use href="#i-parking"/></svg><span>Parkings</span>
        </button>
        <button class="nav-btn" data-mode="stationnement">
            <svg class="ic" aria-hidden="true"><use href="#i-car"/></svg><span>Voirie</span>
        </button>
        <span id="nav-indicator"></span>
    </nav>

    <div class="scrim" id="scrim" hidden></div>

    <section id="arrivals-sheet" class="sheet" hidden aria-label="Prochains passages">
        <div class="sheet-grab"></div>
        <header class="sheet-head">
            <div class="sheet-head-txt">
                <h2 id="sheet-title">Arrêt</h2>
                <p id="sheet-sub"></p>
            </div>
            <button id="sheet-close" class="icon-btn" aria-label="Fermer"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </header>
        <div id="sheet-body"></div>
    </section>

    <section id="menu-sheet" class="sheet" hidden aria-label="Menu">
        <div class="sheet-grab"></div>
        <header class="sheet-head">
            <div class="sheet-head-txt"><h2>Montpellier Mobilité</h2><p>Tram en temps réel · TAM</p></div>
            <button id="menu-close" class="icon-btn" aria-label="Fermer"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </header>
        <div class="menu-block">
            <p class="menu-label">Thème</p>
            <div class="seg" id="theme-seg" role="group" aria-label="Thème">
                <button data-theme="auto" class="active">Auto</button>
                <button data-theme="light">Clair</button>
                <button data-theme="dark">Sombre</button>
            </div>
        </div>
        <div class="menu-block">
            <p class="menu-label">Lignes de tram</p>
            <div id="legend-list"></div>
        </div>
        <div class="menu-list">
            <button id="report-bug" class="menu-item">
                <svg class="ic" aria-hidden="true"><use href="#i-flag"/></svg>
                <span>Signaler un bug</span>
            </button>
            <div class="menu-item is-static">
                <svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>
                <span>Données : Montpellier Méditerranée Métropole (Open Data)</span>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
    <script src="/js/vendor/MovingMarker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
